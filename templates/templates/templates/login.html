<!DOCTYPE html>
<html>
<head><title>Login - NOVACARES</title></head>
<body style="padding: 30px; font-family: Arial;">
    <h2>Login</h2>
    <form method="POST">
        <input name="username" placeholder="Username" required style="padding: 10px; width: 250px;"><br><br>
        <input name="password" type="password" placeholder="Password" required style="padding: 10px; width: 250px;"><br><br>
        <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none;">Login</button>
    </form>
    <p>No account? <a href="/register">Register</a></p>
</body>
</html>
