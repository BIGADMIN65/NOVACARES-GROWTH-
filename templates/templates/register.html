<!DOCTYPE html>
<html>
<head><title>Register - NOVACARES</title></head>
<body style="padding: 30px; font-family: Arial;">
    <h2>Create Account</h2>
    <form method="POST">
        <input name="username" placeholder="Username" required style="padding: 10px; width: 250px;"><br><br>
        <input name="email" type="email" placeholder="Email" required style="padding: 10px; width: 250px;"><br><br>
        <input name="password" type="password" placeholder="Password" required style="padding: 10px; width: 250px;"><br><br>
        <button type="submit" style="padding: 10px 20px; background: #28a745; color: white; border: none;">Register</button>
    </form>
    <p>Already have account? <a href="/login">Login</a></p>
</body>
</html>
