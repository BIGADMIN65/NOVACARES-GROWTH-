<!DOCTYPE html>
<html>
<head>
    <title>Login - NOVACARES</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 50px; text-align: center; }
        .box { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 10px; }
        input, button { width: 90%; padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Login to NOVACARES</h2>
        <form method="POST">
            <input name="email" type="email" placeholder="Email" required><br>
            <input name="password" type="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Don't have account? <a href="/signup">Sign up here</a></p>
    </div>
</body>
</html>
